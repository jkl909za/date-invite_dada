<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ดาด้าไปเที่ยวกันม่ะ?❤️</title>

  <!-- Google Fonts (Kanit) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;700&display=swap" rel="stylesheet">

  <!-- Confetti Library -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Kanit', sans-serif;
      background: linear-gradient(135deg, #ffe0e9 0%, #d4f8f8 100%);
      overflow-x: hidden;
      margin: 0;
      padding: 15px;
      position: relative;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }

    .heart-icon {
      display: inline-block;
      animation: pulse 1s infinite;
      color: #ff4d6d;
    }
    
    h1 {
      color: #333;
      margin-top: 0;
      margin-bottom: 10px;
      text-shadow: 2px 2px 4px rgba(255,255,255,0.7);
      text-align: center;
      z-index: 10;
      font-size: 22px;
    }

    #pleaText {
      font-size: 20px;
      font-weight: 600;
      color: #ff4d6d;
      margin-bottom: 15px;
      height: 30px;
      text-shadow: 1px 1px 3px rgba(255, 255, 255, 0.9);
      z-index: 10;
      transition: transform 0.15s ease-out;
      user-select: none;
      text-align: center;
    }

    .pop-effect {
      transform: scale(1.3) rotate(-3deg);
    }

    /* Container การ์ดส่วนกลางปรับตามเนื้อหา */
    .container {
      position: relative;
      width: 100%;
      max-width: 380px;  
      min-height: 240px;
      height: auto;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      border: 2px dashed rgba(255, 255, 255, 0.9); 
      border-radius: 25px;
      background-color: rgba(255, 255, 255, 0.65);
      backdrop-filter: blur(5px);
      transition: all 0.3s ease;
      z-index: 10;
      padding: 20px 15px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.05);
    }

    /* Step 1 ล็อคความสูงเฉพาะปุ่มวิ่งหนี */
    #step1 {
      position: relative;
      width: 100%;
      min-height: 200px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
    }

    /* ปุ่มหลักทั่วไป */
    button.btn-action {
      padding: 10px 24px;
      font-size: 18px;
      font-weight: 600;
      font-family: 'Kanit', sans-serif;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,0,0,0.12);
      user-select: none;
      transition: all 0.2s ease;
      background-color: #ff4d6d;
      color: white;
      margin-top: 10px;
    }

    button.btn-action:hover {
      transform: scale(1.05);
    }

    /* ปุ่มไม่ไป */
    #noBtn {
      padding: 10px 24px;
      font-size: 18px;
      font-weight: 600;
      font-family: 'Kanit', sans-serif;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,0,0,0.12);
      background-color: #ffffff;
      color: #ff4d6d;
      white-space: nowrap;
      z-index: 20;
    }

    /* Grid สำหรับการ์ดตัวเลือก */
    .option-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      width: 100%;
      margin-top: 10px;
      margin-bottom: 10px;
    }

    .option-card {
      background: white;
      border: 2px solid transparent;
      border-radius: 15px;
      padding: 12px 5px;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 3px 8px rgba(0,0,0,0.05);
    }

    .option-card.selected {
      border-color: #ff4d6d;
      background-color: #fff0f3;
      transform: scale(1.03);
    }

    .option-icon {
      font-size: 32px;
      margin-bottom: 4px;
    }

    .option-name {
      font-size: 15px;
      font-weight: 600;
      color: #333;
    }

    /* ฟอร์มเลือกวันเวลา */
    #dateStep {
      display: none;
      flex-direction: column;
      align-items: center;
      width: 100%;
      gap: 12px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
      width: 100%;
      max-width: 260px;
      text-align: left;
    }

    .input-group label {
      font-size: 15px;
      color: #444;
      font-weight: 600;
    }

    .input-group input {
      padding: 10px 14px;
      border-radius: 12px;
      border: 2px solid #ff9aa2;
      font-family: 'Kanit', sans-serif;
      font-size: 15px;
      outline: none;
      background: white;
      width: 100%;
    }

    /* หน้าสรุป */
    #successArea {
      display: none; 
      flex-direction: column;
      align-items: center;
      animation: fadeIn 0.8s ease-out;
      z-index: 10;
      width: 100%;
      max-width: 360px;
    }

    .photo-card {
      background: white;
      padding: 10px;
      border-radius: 15px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.12);
      transform: rotate(-2deg);
      margin-bottom: 15px;
      width: 100%;
    }

    #successArea img {
      width: 100%;
      max-height: 240px;
      border-radius: 10px;
      object-fit: cover;
      display: block;
    }

    .summary-box {
      background: rgba(255, 255, 255, 0.95);
      padding: 15px 20px;
      border-radius: 20px;
      text-align: left;
      box-shadow: 0 4px 15px rgba(0,0,0,0.06);
      width: 100%;
    }

    .summary-box h3 {
      margin: 0 0 10px 0;
      color: #ff4d6d;
      font-size: 18px;
      text-align: center;
    }

    .summary-box p {
      margin: 6px 0;
      color: #444;
      font-size: 15px;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }

    .floating-heart {
      position: absolute;
      pointer-events: none;
      animation: floatUp linear infinite;
      opacity: 0.6;
    }

    @keyframes floatUp {
      0% { transform: translateY(100vh) rotate(0deg); opacity: 0.6; }
      100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
    }
  </style>
</head>
<body>

  <h1 id="mainTitle"><span class="heart-icon">❤️</span> ดาด้าไปเที่ยวกันม่ะ? <span class="heart-icon">❤️</span></h1>
  
  <div id="pleaText">ไปป่าว 🥺</div>

  <div class="container" id="playArea">
    
    <!-- Step 1: ปุ่มคำถามแรก -->
    <div id="step1">
      <button id="yesBtn" class="btn-action" style="margin-top:0;" onclick="goToStep2()">ไปดิ! ❤️</button>
      <button id="noBtn" onmouseover="moveButton()" ontouchstart="moveButton(event)">ไม่ไป! ❌</button>
    </div>

    <!-- Step 2: เลือกสถานที่ -->
    <div id="placeStep" style="display: none; flex-direction: column; align-items: center; width: 100%;">
      <h3 style="color: #333; margin: 0 0 5px 0; font-size: 18px;">อยากไปไหนดีน้า? 🤔</h3>
      <div class="option-grid">
        <div class="option-card" onclick="selectPlace(this, 'ไปดูหนัง 🍿')">
          <div class="option-icon">🍿</div>
          <div class="option-name">ดูหนัง</div>
        </div>
        <div class="option-card" onclick="selectPlace(this, 'ไปรับลมทะเล 🏖️')">
          <div class="option-icon">🏖️</div>
          <div class="option-name">เที่ยวทะเล</div>
        </div>
      </div>
      <button class="btn-action" onclick="goToStep3()">ถัดไป ➡️</button>
    </div>

    <!-- Step 3: เลือกอาหาร -->
    <div id="foodStep" style="display: none; flex-direction: column; align-items: center; width: 100%;">
      <h3 style="color: #333; margin: 0 0 5px 0; font-size: 18px;">แล้วมื้อนี้กินไรดี? 😋</h3>
      <div class="option-grid">
        <div class="option-card" onclick="selectFood(this, 'ส้มตำแซ่บๆ 🥗')">
          <div class="option-icon">🥗</div>
          <div class="option-name">ส้มตำ</div>
        </div>
        <div class="option-card" onclick="selectFood(this, 'สเต็กฉ่ำๆ 🥩')">
          <div class="option-icon">🥩</div>
          <div class="option-name">สเต็ก</div>
        </div>
        <div class="option-card" onclick="selectFood(this, 'KFC ไก่ทอด 🍗')">
          <div class="option-icon">🍗</div>
          <div class="option-name">KFC</div>
        </div>
        <div class="option-card" onclick="selectFood(this, 'ปิ้งย่างฟินๆ 🥓')">
          <div class="option-icon">🥓</div>
          <div class="option-name">ปิ้งย่าง</div>
        </div>
      </div>
      <button class="btn-action" onclick="goToStep4()">ถัดไป ➡️</button>
    </div>

    <!-- Step 4: เลือกวันและเวลา -->
    <div id="dateStep">
      <h3 style="color: #333; margin: 0 0 5px 0; font-size: 18px;">นัดวันเวลาหน่อยสิ 🗓️</h3>
      <div class="input-group">
        <label for="travelDate">📅 ไปวันไหนดี:</label>
        <input type="date" id="travelDate">
      </div>
      <div class="input-group">
        <label for="pickupTime">⏰ ให้ไปรับกี่โมง:</label>
        <input type="time" id="pickupTime">
      </div>
      <button class="btn-action" onclick="showSummary()">ตกลงตามนี้! ❤️</button>
    </div>

  </div>

  <!-- Step 5: สรุปผล -->
  <div id="successArea">
    <div class="photo-card">
      <img src="testpics.jpg" alt="เย้!">
    </div>
    <h2 style="margin: 0 0 10px 0; font-size: 22px;">เย้! ดีลเรียบร้อย ❤️</h2>
    <div class="summary-box">
      <h3>สรุปแพลนเดท ✨</h3>
      <p id="summaryPlace">📍 สถานที่: -</p>
      <p id="summaryFood">🍽️ มื้อนี้กิน: -</p>
      <p id="summaryDate">📅 วันที่: -</p>
      <p id="summaryTime">⏰ เวลาไปรับ: -</p>
    </div>
  </div>

  <script>
    const pleaMessages = [
      'ไปป่าว 🥺',
      'ขอร้องง 🥺',
      'เดะให้แมวไปกัดหูเลย 😾',
      'ไปม่ะ 🥺'
    ];
    let pleaIndex = 0;

    let selectedPlaceText = "";
    let selectedFoodText = "";

    function createFloatingHearts() {
      const container = document.body;
      for (let i = 0; i < 10; i++) {
        createHeart(container);
      }
    }

    function createHeart(container) {
      const heart = document.createElement('div');
      heart.innerHTML = '❤️';
      heart.classList.add('floating-heart');
      
      const size = Math.random() * 16 + 10;
      const left = Math.random() * 100;
      const duration = Math.random() * 4 + 4;
      const delay = Math.random() * 4;

      heart.style.fontSize = `${size}px`;
      heart.style.left = `${left}%`;
      heart.style.animationDuration = `${duration}s`;
      heart.style.animationDelay = `${delay}s`;

      container.appendChild(heart);
      heart.addEventListener('animationend', () => {
        heart.remove();
        createHeart(container);
      });
    }

    window.addEventListener('load', () => {
      createFloatingHearts();
      document.getElementById('travelDate').valueAsDate = new Date();
      document.getElementById('pickupTime').value = "17:00";
    });

    function moveButton(e) {
      if(e && e.type === 'touchstart') e.preventDefault();
      
      const btn = document.getElementById('noBtn');
      const container = document.getElementById('step1');
      const pleaText = document.getElementById('pleaText');
      
      pleaIndex = (pleaIndex + 1) % pleaMessages.length;
      pleaText.innerText = pleaMessages[pleaIndex];

      pleaText.classList.add('pop-effect');
      setTimeout(() => pleaText.classList.remove('pop-effect'), 150);

      btn.style.position = 'absolute';

      const maxW = container.clientWidth - btn.offsetWidth;
      const maxH = container.clientHeight - btn.offsetHeight;

      const randomX = Math.floor(Math.random() * Math.max(0, maxW));
      const randomY = Math.floor(Math.random() * Math.max(0, maxH));

      btn.style.left = `${randomX}px`;
      btn.style.top = `${randomY}px`;
    }

    function goToStep2() {
      document.getElementById('step1').style.display = 'none';
      document.getElementById('pleaText').style.display = 'none';
      document.getElementById('placeStep').style.display = 'flex';
      document.getElementById('mainTitle').innerText = '❤️ ปักหมุดที่เที่ยว ❤️';
    }

    function selectPlace(element, placeName) {
      const cards = document.querySelectorAll('#placeStep .option-card');
      cards.forEach(card => card.classList.remove('selected'));
      element.classList.add('selected');
      selectedPlaceText = placeName;
    }

    function goToStep3() {
      if(!selectedPlaceText) {
        alert('เลือกระบุสถานที่อยากไปก่อนน้าา ✨');
        return;
      }
      document.getElementById('placeStep').style.display = 'none';
      document.getElementById('foodStep').style.display = 'flex';
      document.getElementById('mainTitle').innerText = '❤️ เลือกลิสต์อาหาร ❤️';
    }

    function selectFood(element, foodName) {
      const cards = document.querySelectorAll('#foodStep .option-card');
      cards.forEach(card => card.classList.remove('selected'));
      element.classList.add('selected');
      selectedFoodText = foodName;
    }

    function goToStep4() {
      if(!selectedFoodText) {
        alert('เลือกเมนูที่อยากกินก่อนน้าา 😋');
        return;
      }
      document.getElementById('foodStep').style.display = 'none';
      document.getElementById('dateStep').style.display = 'flex';
      document.getElementById('mainTitle').innerText = '❤️ ล็อคคิววันเวลา ❤️';
    }

    function showSummary() {
      const dateVal = document.getElementById('travelDate').value;
      const timeVal = document.getElementById('pickupTime').value;

      if(!dateVal || !timeVal) {
        alert('ใส่วันและเวลาไปรับก่อนน้าา ⏰');
        return;
      }

      const dateObj = new Date(dateVal);
      const formattedDate = dateObj.toLocaleDateString('th-TH', {
        year: 'numeric',
        month: 'long',
        day: 'numeric'
      });

      document.getElementById('summaryPlace').innerText = `📍 สถานที่: ${selectedPlaceText}`;
      document.getElementById('summaryFood').innerText = `🍽️ มื้อนี้กิน: ${selectedFoodText}`;
      document.getElementById('summaryDate').innerText = `📅 วันที่: ${formattedDate}`;
      document.getElementById('summaryTime').innerText = `⏰ เวลาไปรับ: ${timeVal} น.`;

      document.getElementById('mainTitle').style.display = 'none';
      document.getElementById('playArea').style.display = 'none';
      document.getElementById('successArea').style.display = 'flex';

      confetti({
        particleCount: 120,
        spread: 70,
        origin: { y: 0.6 }
      });
    }
  </script>

</body>
</html>
